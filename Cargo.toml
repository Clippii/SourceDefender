[package]
name = "source-defender"
version = "0.5.1"
edition = "2024"
description = "Native desktop blue-team repository investigation game"

[[bin]]
name = "SourceDefender"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "accesskit"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = "=0.4.45"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "wgsl", "parking_lot"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "x11", "wayland"] }

[profile.release]
opt-level = 2
strip = true
